{% extends 'base.html' %}
{% block content %}
    <h1>{{ FAQ.title }}</h1>
    <p>Question: {{ FAQ.text }}</p>
    <p>Answer: {{ FAQ.answer }}</p>
    <p>Status: {{ FAQ.status }}</p>
    <p>category: {{ FAQ.category }}</p>
    
    <p>
        {% if user.profile.role == 'admin' %}
        <a href="{% url 'faq:FAQ-update' pk=FAQ.pk %}">Edit</a>
        <a href="{% url 'faq:FAQ-delete' pk=FAQ.pk %}">Delete</a>
        {% endif %}
        <p><a href="{% url 'faq:FAQ-list' %}">Go back</a></p>
    </p>

{% endblock %}
