{% extends 'base.html' %}
{% block content %}
    <h1>Create/Update new Comment</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    <p><a href="{% url 'forum-comments' pk=forum.id %}">Go Back</a></p>
{% endblock %}
