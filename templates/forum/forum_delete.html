{% extends 'base.html' %}
{% block content %}
    <h1>Delete Forum</h1>
    <p>Are you sure you want to delete forum "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes</button>
    </form>
    <p><a href="{% url 'forum-list' %}">Return to forum list page</a></p>
{% endblock %}
