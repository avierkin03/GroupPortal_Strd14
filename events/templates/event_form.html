{% extends 'events/base.html' %}

{% block content %}

<div class="card p-4">

    <h3>Создать / Редактировать событие</h3>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label>Название</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label>Описание</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label>Дата</label>
            {{ form.date }}
        </div>

        <button class="btn btn-success">Сохранить</button>
    </form>

</div>

{% endblock %}
